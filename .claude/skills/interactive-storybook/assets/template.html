<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1e1a14;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Noto Serif SC','STSong',serif;overflow:hidden;user-select:none}
.title-bar{position:fixed;top:0;left:0;right:0;text-align:center;padding:10px 20px;background:linear-gradient(180deg,rgba(30,26,20,.88) 0%,rgba(30,26,20,0) 100%);z-index:200;pointer-events:none}
.title-bar h1{color:#e0d6c2;font-size:17px;font-weight:400;letter-spacing:6px}
.book-container{position:relative;width:90vw;max-width:940px;aspect-ratio:4/3;max-height:78vh;border-radius:4px;overflow:hidden;box-shadow:2px 2px 20px rgba(0,0,0,.4)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:#f5f0e1;opacity:0;visibility:hidden;transition:none}
.page.active{opacity:1;visibility:visible}
.page.slide-out-left{animation:slideOutLeft .65s cubic-bezier(.4,0,.2,1) forwards}
.page.slide-in-right{animation:slideInRight .65s cubic-bezier(.4,0,.2,1) forwards}
.page.slide-out-right{animation:slideOutRight .65s cubic-bezier(.4,0,.2,1) forwards}
.page.slide-in-left{animation:slideInLeft .65s cubic-bezier(.4,0,.2,1) forwards}
@keyframes slideOutLeft{0%{opacity:1;visibility:visible;transform:translateX(0) rotateY(0);filter:brightness(1)}100%{opacity:0;visibility:hidden;transform:translateX(-30%) rotateY(8deg);filter:brightness(.7)}}
@keyframes slideInRight{0%{opacity:0;visibility:visible;transform:translateX(40%) rotateY(-5deg);filter:brightness(.8)}100%{opacity:1;visibility:visible;transform:translateX(0) rotateY(0);filter:brightness(1)}}
@keyframes slideOutRight{0%{opacity:1;visibility:visible;transform:translateX(0) rotateY(0);filter:brightness(1)}100%{opacity:0;visibility:hidden;transform:translateX(40%) rotateY(-5deg);filter:brightness(.8)}}
@keyframes slideInLeft{0%{opacity:0;visibility:visible;transform:translateX(-30%) rotateY(8deg);filter:brightness(.7)}100%{opacity:1;visibility:visible;transform:translateX(0) rotateY(0);filter:brightness(1)}}
.page-shadow{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;background:linear-gradient(to right,rgba(0,0,0,.12) 0%,transparent 15%,transparent 85%,rgba(0,0,0,.06) 100%);transition:opacity .3s}
.book-container.turning .page-shadow{opacity:1}
.img-wrap{flex:1;position:relative;overflow:hidden;background:#f5f0e1}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
.img-wrap canvas.fx{position:absolute;inset:0;pointer-events:none;z-index:2}
.text-area{padding:14px 24px;background:#f5f0e1;color:#3a2f20;font-size:clamp(12px,1.5vw,17px);line-height:1.85;text-align:center;min-height:64px;display:flex;align-items:center;justify-content:center;position:relative}
.text-area::before{content:'';position:absolute;top:0;left:24px;right:24px;height:1px;background:linear-gradient(90deg,transparent,#c4b99a,transparent)}
.text-area span{opacity:0;transform:translateY(6px);transition:opacity .7s ease,transform .7s ease}
.page.active .text-area span.show{opacity:1;transform:translateY(0)}
.page-num{position:absolute;bottom:4px;right:14px;font-size:11px;color:#b0a48a}
.cover-face{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cover-face.front{background:linear-gradient(145deg,#f5f0e1,#ebe3d0 40%,#d4c5a9)}
.cover-face.front::before{content:'';position:absolute;inset:20px;border:1.5px solid #c4b99a;border-radius:2px}
.cover-face h2{font-size:clamp(24px,3.8vw,44px);color:#3a2f20;letter-spacing:10px;font-weight:700;opacity:0;transition:opacity 1s ease .3s}
.cover-face .sub{margin-top:10px;font-size:clamp(12px,1.5vw,17px);color:#8a7a60;letter-spacing:4px;opacity:0;transition:opacity .8s ease .7s}
.cover-face .tag{margin-top:24px;font-size:clamp(10px,1.1vw,13px);color:#a8977a;letter-spacing:2px;opacity:0;transition:opacity .8s ease 1.1s}
.page.active .cover-face h2,.page.active .cover-face .sub,.page.active .cover-face .tag{opacity:1}
.cover-face.ending{background:linear-gradient(145deg,#d4c5a9,#ebe3d0 60%,#f5f0e1)}
.cover-face.ending canvas.glow-fx{position:absolute;inset:0;pointer-events:none}
.cover-face.ending .moral{max-width:72%;font-size:clamp(15px,2vw,24px);color:#3a2f20;line-height:2.2;text-align:center;letter-spacing:2px;opacity:0;transition:opacity 1.2s ease .4s}
.cover-face.ending .src{margin-top:18px;font-size:clamp(11px,1.2vw,14px);color:#a8977a;letter-spacing:3px;opacity:0;transition:opacity .8s ease 1.2s}
.page.active .cover-face.ending .moral,.page.active .cover-face.ending .src{opacity:1}
.nav-bar{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:20px;padding:16px;background:linear-gradient(0deg,rgba(30,26,20,.9) 0%,rgba(30,26,20,0) 100%);z-index:200}
.nav-btn{background:rgba(245,240,225,.1);border:1px solid rgba(245,240,225,.22);color:#e0d6c2;padding:8px 26px;border-radius:24px;cursor:pointer;font-family:inherit;font-size:14px;letter-spacing:2px;transition:all .25s;backdrop-filter:blur(6px)}
.nav-btn:hover:not(:disabled){background:rgba(245,240,225,.2);border-color:rgba(245,240,225,.4)}
.nav-btn:disabled{opacity:.2;cursor:default}
.page-ind{color:#a8977a;font-size:14px;min-width:80px;text-align:center;letter-spacing:1px}
.progress{position:fixed;bottom:56px;display:flex;gap:5px;z-index:200}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(245,240,225,.18);transition:all .35s}
.dot.on{background:rgba(245,240,225,.65);transform:scale(1.3)}
@media(max-width:640px){.book-container{width:96vw}.nav-btn{padding:6px 16px;font-size:12px}}
</style>
</head>
<body>
<div class="title-bar"><h1>{{TITLE_SPACED}}</h1></div>
<div class="book-container" id="bookContainer"><div class="page-shadow"></div></div>
<div class="progress" id="progress"></div>
<div class="nav-bar">
  <button class="nav-btn" id="prevBtn">&larr; 上一页</button>
  <span class="page-ind" id="pageInd">封面</span>
  <button class="nav-btn" id="nextBtn">下一页 &rarr;</button>
</div>
<script>
const STORY_TITLE='{{TITLE_JS}}';
const STORY_SUBTITLE='{{SUBTITLE_JS}}';
const ENDING_TEXT='{{ENDING_TEXT_JS}}';
const ENDING_SOURCE='{{ENDING_SOURCE_JS}}';
const TOTAL_PAGES={{TOTAL_PAGES}};
const PAGES=[
{{PAGES_JS}}
];

class PS{
  constructor(c){this.c=c;this.x=c.getContext('2d');this.p=[];this.on=false;this.af=null}
  resize(){const r=devicePixelRatio||1,rect=this.c.parentElement.getBoundingClientRect();this.w=rect.width;this.h=rect.height;this.c.width=this.w*r;this.c.height=this.h*r;this.c.style.width=this.w+'px';this.c.style.height=this.h+'px';this.x.setTransform(r,0,0,r,0,0)}
  start(g,d,u){this.stop();this.resize();this.gn=g;this.df=d;this.uf=u;this.p=[];this.on=true;this._t=this._t.bind(this);this.af=requestAnimationFrame(this._t)}
  stop(){this.on=false;if(this.af)cancelAnimationFrame(this.af);this.af=null;this.p=[];if(this.x)this.x.clearRect(0,0,this.w,this.h)}
  _t(t){if(!this.on)return;const x=this.x;x.clearRect(0,0,this.w,this.h);const n=this.gn(t,this.w,this.h);if(n){if(Array.isArray(n))this.p.push(...n);else this.p.push(n)}for(let i=this.p.length-1;i>=0;i--){const p=this.p[i];this.uf(p,this.w,this.h);if(p.life<=0||p.dead){this.p.splice(i,1);continue}this.df(x,p,this.w,this.h)}this.af=requestAnimationFrame(this._t)}
}

const FX={
  mist(ps){let lt=0;ps.start((t,w,h)=>{if(t-lt<300)return null;lt=t;return{x:-60,y:Math.random()*h*.7,r:30+Math.random()*50,vx:.15+Math.random()*.25,vy:(Math.random()-.5)*.1,life:1,fd:.0008+Math.random()*.0005}},(c,p)=>{c.globalAlpha=p.life*.18;const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();c.globalAlpha=1},(p)=>{p.x+=p.vx;p.y+=p.vy;p.life-=p.fd})},
  shimmer(ps){let lt=0;ps.start((t,w,h)=>{if(t-lt<80)return null;lt=t;return{x:Math.random()*w,y:h*.3+Math.random()*h*.4,r:1+Math.random()*2.5,life:1,fd:.015+Math.random()*.01,ph:Math.random()*6.28}},(c,p)=>{c.globalAlpha=p.life*.6*(.5+.5*Math.sin(p.ph));c.fillStyle='#fffbe6';c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();c.globalAlpha=1},(p)=>{p.life-=p.fd;p.ph+=.08})},
  leaves(ps){let lt=0;ps.start((t,w,h)=>{if(t-lt<600)return null;lt=t;return{x:Math.random()*w,y:-10,vx:-.2+Math.random()*.4,vy:.4+Math.random()*.6,rot:Math.random()*6.28,vr:(Math.random()-.5)*.03,sw:Math.random()*6.28,life:1,fd:.002}},(c,p)=>{c.globalAlpha=p.life*.5;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='#7a9a5a';c.beginPath();c.ellipse(0,0,6,2.5,0,0,Math.PI*2);c.fill();c.restore();c.globalAlpha=1},(p,w,h)=>{p.x+=p.vx+Math.sin(p.sw)*.3;p.y+=p.vy;p.rot+=p.vr;p.sw+=.02;p.life-=p.fd;if(p.y>h+20)p.dead=true})},
  storm(ps){let lt=0,fl=false;ps.start((t,w,h)=>{if(!fl&&Math.random()<.002){fl=true}const d=[];if(t-lt>16){lt=t;for(let i=0;i<8;i++)d.push({x:Math.random()*(w+100)-50,y:-10,len:12+Math.random()*18,spd:8+Math.random()*6,life:1,tp:'r'})}if(fl){d.push({tp:'f',life:1});fl=false}return d.length?d:null},(c,p,w,h)=>{if(p.tp==='f'){c.globalAlpha=p.life*.25;c.fillStyle='#fff';c.fillRect(0,0,w,h);c.globalAlpha=1;return}c.globalAlpha=.35;c.strokeStyle='#b8c4d0';c.lineWidth=1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-3,p.y+p.len);c.stroke();c.globalAlpha=1},(p,w,h)=>{if(p.tp==='f'){p.life-=.06;return}p.x-=2;p.y+=p.spd;if(p.y>h+30)p.dead=true})},
  ripple(ps){let lt=0;ps.start((t,w,h)=>{if(t-lt<1200)return null;lt=t;return{x:w*.3+Math.random()*w*.4,y:h*.55+Math.random()*h*.15,r:0,mx:30+Math.random()*40,life:1,fd:.012}},(c,p)=>{c.globalAlpha=p.life*.35;c.strokeStyle='rgba(180,200,220,.6)';c.lineWidth=1.2;c.beginPath();c.ellipse(p.x,p.y,p.r,p.r*.35,0,0,Math.PI*2);c.stroke();c.globalAlpha=1},(p)=>{p.r+=.5;p.life-=p.fd})},
  pulse(ps){ps.start(()=>null,()=>{},()=>{});const img=ps.c.parentElement.querySelector('img');if(img){let ph=0;const a=()=>{if(!ps.on)return;ph+=.015;img.style.transform='scale('+(1+Math.sin(ph)*.012)+')';requestAnimationFrame(a)};requestAnimationFrame(a)}},
  splash(ps){let lt=0;ps.start((t,w,h)=>{if(t-lt<120)return null;lt=t;return{x:w*.3+Math.random()*w*.4,y:h*.55,vx:(Math.random()-.5)*2,vy:-1.5-Math.random()*2.5,r:1.5+Math.random()*2,life:1,fd:.02}},(c,p)=>{c.globalAlpha=p.life*.5;c.fillStyle='rgba(180,200,220,.7)';c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();c.globalAlpha=1},(p)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=p.fd})},
  glow(ps){let ph=0;ps.start(()=>null,()=>{},()=>{});const c=ps.x,a=()=>{if(!ps.on)return;ph+=.02;c.clearRect(0,0,ps.w,ps.h);c.globalAlpha=.08+Math.sin(ph)*.04;const g=c.createRadialGradient(ps.w*.5,ps.h*.45,0,ps.w*.5,ps.h*.45,ps.w*.4);g.addColorStop(0,'rgba(255,220,150,.5)');g.addColorStop(1,'rgba(255,220,150,0)');c.fillStyle=g;c.fillRect(0,0,ps.w,ps.h);c.globalAlpha=1;requestAnimationFrame(a)};requestAnimationFrame(a)},
  current(ps){let lt=0;ps.start((t,w,h)=>{if(t-lt<60)return null;lt=t;return{x:w+10,y:h*.4+Math.random()*h*.3,len:15+Math.random()*25,spd:1.5+Math.random()*2,life:1,fd:.008}},(c,p)=>{c.globalAlpha=p.life*.25;c.strokeStyle='rgba(160,185,210,.5)';c.lineWidth=1;c.beginPath();c.moveTo(p.x,p.y);c.quadraticCurveTo(p.x-p.len*.5,p.y-3,p.x-p.len,p.y+2);c.stroke();c.globalAlpha=1},(p)=>{p.x-=p.spd;p.life-=p.fd})},
  sunbeam(ps){let ph=0;ps.start(()=>null,()=>{},()=>{});const c=ps.x,a=()=>{if(!ps.on)return;ph+=.008;c.clearRect(0,0,ps.w,ps.h);for(let i=0;i<5;i++){const ang=-.3+i*.15+Math.sin(ph+i)*.03;c.globalAlpha=.04+Math.sin(ph*1.5+i*.7)*.025;c.save();c.translate(ps.w*.85,ps.h*.05);c.rotate(ang);const g=c.createLinearGradient(0,0,-ps.w,0);g.addColorStop(0,'rgba(255,230,150,.4)');g.addColorStop(1,'rgba(255,230,150,0)');c.fillStyle=g;c.fillRect(-ps.w,-8,ps.w,16);c.restore()}c.globalAlpha=1;requestAnimationFrame(a)};requestAnimationFrame(a)},
  sparkle(ps){let ls=0,ll=0;ps.start((t,w,h)=>{const o=[];if(t-ls>100){ls=t;o.push({x:Math.random()*w,y:Math.random()*h*.7,r:1+Math.random()*2,life:1,fd:.012,ph:Math.random()*6.28,tp:'s'})}if(t-ll>800){ll=t;o.push({x:Math.random()*w,y:-10,vx:-.3+Math.random()*.6,vy:.3+Math.random()*.5,rot:Math.random()*6.28,vr:(Math.random()-.5)*.04,sw:Math.random()*6.28,life:1,fd:.003,tp:'l'})}return o.length?o:null},(c,p)=>{if(p.tp==='s'){const a=p.life*.6*(.5+.5*Math.sin(p.ph));c.globalAlpha=a;c.fillStyle='#ffeaa0';c.beginPath();c.arc(p.x,p.y,p.r,0,Math.PI*2);c.fill();c.strokeStyle='#ffeaa0';c.lineWidth=.5;c.beginPath();c.moveTo(p.x-p.r*2,p.y);c.lineTo(p.x+p.r*2,p.y);c.stroke();c.beginPath();c.moveTo(p.x,p.y-p.r*2);c.lineTo(p.x,p.y+p.r*2);c.stroke();c.globalAlpha=1}else{c.globalAlpha=p.life*.45;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='#c89040';c.beginPath();c.ellipse(0,0,5,2,0,0,Math.PI*2);c.fill();c.restore();c.globalAlpha=1}},(p,w,h)=>{if(p.tp==='s'){p.ph+=.06;p.life-=p.fd}else{p.x+=p.vx+Math.sin(p.sw)*.25;p.y+=p.vy;p.rot+=p.vr;p.sw+=.015;p.life-=p.fd;if(p.y>h+20)p.dead=true}})
}
};

class StoryBook{
  constructor(){
    this.cur=0;this.container=document.getElementById('bookContainer');
    this.pages=[];this.fxSystems=[];this.turning=false;this.mx=.5;this.my=.5;
    this._build();this._bind();this._show(0);
  }
  _build(){
    PAGES.forEach((p,i)=>{
      const el=document.createElement('div');el.className='page';el.dataset.i=i;
      if(p.type==='cover'){
        el.innerHTML='<div class="cover-face front"><h2>'+STORY_TITLE+'</h2><div class="sub">'+STORY_SUBTITLE+'</div><div class="tag">Interactive Storybook</div></div>';
        this.fxSystems.push(null);
      }else if(p.type==='ending'){
        el.innerHTML='<div class="cover-face ending"><canvas class="glow-fx"></canvas><div class="moral">'+ENDING_TEXT+'</div><div class="src">'+ENDING_SOURCE+'</div></div>';
        this.fxSystems.push(null);
      }else{
        el.innerHTML='<div class="img-wrap"><img src="'+p.img+'" alt="Page '+p.num+'" loading="'+(i<=2?'eager':'lazy')+'"><canvas class="fx"></canvas></div><div class="text-area"><span>'+p.text+'</span></div><span class="page-num">'+p.num+' / '+TOTAL_PAGES+'</span>';
        this.fxSystems.push(new PS(el.querySelector('canvas.fx')));
      }
      this.container.appendChild(el);this.pages.push(el);
      const dot=document.createElement('div');dot.className='dot';
      document.getElementById('progress').appendChild(dot);
    });
  }
  _bind(){
    document.getElementById('prevBtn').addEventListener('click',()=>this.prev());
    document.getElementById('nextBtn').addEventListener('click',()=>this.next());
    document.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();this.next()}
      else if(e.key==='ArrowLeft'){e.preventDefault();this.prev()}
    });
    let sx=0;
    document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
    document.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(d<-60)this.next();else if(d>60)this.prev()},{passive:true});
    document.addEventListener('mousemove',e=>{this.mx=e.clientX/innerWidth;this.my=e.clientY/innerHeight;this._parallax()});
    window.addEventListener('resize',()=>this.fxSystems.forEach(s=>{if(s&&s.on)s.resize()}));
  }
  _parallax(){
    const el=this.pages[this.cur];if(!el)return;
    const img=el.querySelector('.img-wrap img');if(!img)return;
    const dx=(this.mx-.5)*-5,dy=(this.my-.5)*-3;
    img.style.transform='translate('+dx+'px,'+dy+'px) scale(1.02)';
  }
  _show(idx){
    this.pages.forEach((p,i)=>{
      if(i===idx){p.classList.add('active')}else{p.classList.remove('active');p.style.opacity='';p.style.visibility=''}
      p.classList.remove('slide-out-left','slide-in-right','slide-out-right','slide-in-left');
    });
    const span=this.pages[idx].querySelector('.text-area span');
    if(span){span.classList.remove('show');setTimeout(()=>span.classList.add('show'),50)}
    this._startFx(idx);this._nav();this._parallax();
    if(PAGES[idx].type==='ending')this._endingGlow(this.pages[idx]);
  }
  _startFx(idx){
    this.fxSystems.forEach(s=>{if(s)s.stop()});
    this.pages.forEach((p,i)=>{if(i!==idx){const img=p.querySelector('.img-wrap img');if(img)img.style.transform=''}});
    const s=this.fxSystems[idx],p=PAGES[idx];
    if(s&&p.fx&&FX[p.fx])FX[p.fx](s);
  }
  _endingGlow(el){
    const cv=el.querySelector('canvas.glow-fx');if(!cv)return;
    const r=devicePixelRatio||1,rect=el.getBoundingClientRect();
    cv.width=rect.width*r;cv.height=rect.height*r;
    cv.style.width=rect.width+'px';cv.style.height=rect.height+'px';
    const c=cv.getContext('2d');c.setTransform(r,0,0,r,0,0);
    const w=rect.width,h=rect.height;let ph=0;
    const a=()=>{if(!el.classList.contains('active'))return;ph+=.015;c.clearRect(0,0,w,h);c.globalAlpha=.1+Math.sin(ph)*.05;const g=c.createRadialGradient(w*.5,h*.4,0,w*.5,h*.4,w*.45);g.addColorStop(0,'rgba(255,210,130,.4)');g.addColorStop(1,'rgba(255,210,130,0)');c.fillStyle=g;c.fillRect(0,0,w,h);c.globalAlpha=1;requestAnimationFrame(a)};
    requestAnimationFrame(a);
  }
  _nav(){
    document.getElementById('prevBtn').disabled=this.cur<=0;
    document.getElementById('nextBtn').disabled=this.cur>=PAGES.length-1;
    const p=PAGES[this.cur],ind=document.getElementById('pageInd');
    if(p.type==='cover')ind.textContent='\u5c01\u9762';
    else if(p.type==='ending')ind.textContent='\u5c3e\u58f0';
    else ind.textContent=p.num+' / '+TOTAL_PAGES;
    document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on',i===this.cur));
  }
  _turn(to,dir){
    if(this.turning)return;
    const from=this.cur;this.turning=true;
    this.container.classList.add('turning');
    const fromEl=this.pages[from],toEl=this.pages[to];
    const oldSpan=fromEl.querySelector('.text-area span');if(oldSpan)oldSpan.classList.remove('show');
    fromEl.classList.add(dir>0?'slide-out-left':'slide-out-right');
    toEl.classList.add('active');
    toEl.classList.add(dir>0?'slide-in-right':'slide-in-left');
    toEl.style.opacity='1';toEl.style.visibility='visible';
    setTimeout(()=>{
      this.container.classList.remove('turning');
      fromEl.classList.remove('active','slide-out-left','slide-out-right');
      fromEl.style.opacity='';fromEl.style.visibility='';
      toEl.classList.remove('slide-in-right','slide-in-left');
      this.cur=to;this.turning=false;
      this._show(to);
    },680);
  }
  next(){if(this.turning||this.cur>=PAGES.length-1)return;this._turn(this.cur+1,1)}
  prev(){if(this.turning||this.cur<=0)return;this._turn(this.cur-1,-1)}
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',()=>{window._book=new StoryBook()})}else{window._book=new StoryBook()}
</script>
