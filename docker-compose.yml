services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dreamwaver
      POSTGRES_PASSWORD: dreamwaver
      POSTGRES_DB: dreamwaver
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamwaver"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dreamwaver
      MINIO_ROOT_PASSWORD: dreamwaver-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 dreamwaver dreamwaver-secret &&
      mc mb -p local/dreamwaver || true &&
      mc anonymous set download local/dreamwaver || true
      "

  sandbox:
    build:
      context: ./services/sandbox
      dockerfile: Dockerfile
    ports: ["50051:50051"]
    environment:
      RUST_LOG: info
      SANDBOX_GRPC_ADDR: 0.0.0.0:50051

  orchestrator:
    build:
      context: ./services/orchestrator
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis: { condition: service_started }
      minio: { condition: service_started }
      sandbox: { condition: service_started }
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://dreamwaver:dreamwaver@postgres:5432/dreamwaver?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: dreamwaver
      S3_SECRET_KEY: dreamwaver-secret
      S3_BUCKET: dreamwaver
      S3_REGION: us-east-1
      SANDBOX_GRPC_ADDR: sandbox:50051
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LOG_LEVEL: info
      ENV: development

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on: [orchestrator]
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080
      NEXT_PUBLIC_WS_BASE: ws://localhost:8080

volumes:
  pg_data:
  redis_data:
  minio_data:
