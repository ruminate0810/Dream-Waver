[package]
name = "dreamwaver-sandbox"
version = "0.1.0"
edition = "2021"
description = "Dream-Waver code-execution sandbox: gRPC service that runs untrusted snippets in isolated wasmtime runtimes."
license = "MIT"
publish = false

[[bin]]
name = "dreamwaver-sandbox"
path = "src/main.rs"

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
async-trait = "0.1"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasmtime is heavy; gate behind a feature so plain `cargo check` is fast in CI.
wasmtime = { version = "26", optional = true }
wasmtime-wasi = { version = "26", optional = true }
cap-std = { version = "3", optional = true }

[features]
default = ["wasm"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:cap-std"]

[build-dependencies]
tonic-build = "0.12"
