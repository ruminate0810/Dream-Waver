<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Noir theme — split-image slide preview">
  <defs>
    <linearGradient id="noirPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3A38"/>
      <stop offset="0.55" stop-color="#1C1C1A"/>
      <stop offset="1" stop-color="#080807"/>
    </linearGradient>
    <radialGradient id="noirRim" cx="0.5" cy="0.4" r="0.8">
      <stop offset="0" stop-color="#F4F1E8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#F4F1E8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- LEFT: B&W photo half -->
  <rect x="0" y="0" width="320" height="360" fill="url(#noirPhoto)"/>
  <rect x="0" y="0" width="320" height="360" fill="url(#noirRim)"/>
  <!-- silhouette suggestion (figure / building) -->
  <rect x="80" y="80" width="160" height="220" fill="#0A0A0B" fill-opacity="0.55"/>
  <rect x="120" y="60" width="80" height="40" fill="#0A0A0B" fill-opacity="0.7"/>
  <circle cx="160" cy="180" r="22" fill="#F4F1E8" fill-opacity="0.18"/>
  <!-- AI credit pill -->
  <rect x="14" y="328" width="92" height="18" rx="9" fill="#0A0A0B" fill-opacity="0.55" stroke="#F4F1E8" stroke-opacity="0.18" stroke-width="0.7"/>
  <text x="22" y="341" font-family="ui-monospace, Menlo, monospace" font-size="7.5" letter-spacing="2" fill="#F4F1E8" fill-opacity="0.7">AI · GEMINI</text>

  <!-- RIGHT: black text half -->
  <rect x="320" y="0" width="320" height="360" fill="#0A0A0B"/>
  <!-- grain dots -->
  <g fill="#F4F1E8" opacity="0.05">
    <circle cx="380" cy="80" r="0.5"/>
    <circle cx="500" cy="160" r="0.4"/>
    <circle cx="450" cy="260" r="0.5"/>
  </g>

  <!-- Yellow sprocket + kicker -->
  <rect x="356" y="116" width="6" height="6" fill="#E8FF3C"/>
  <text x="368" y="121" font-family="ui-monospace, Menlo, monospace" font-size="8" letter-spacing="3" fill="#E8FF3C">FW · 26</text>

  <!-- Title — Bodoni thin -->
  <text x="356" y="172" font-family="'Bodoni Moda', Didot, Georgia, serif" font-size="32" font-weight="200" letter-spacing="0.5" fill="#F4F1E8">Maison Margiela</text>

  <!-- Body lines -->
  <rect x="356" y="192" width="240" height="5" rx="0.5" fill="#F4F1E8" fill-opacity="0.55"/>
  <rect x="356" y="204" width="200" height="5" rx="0.5" fill="#F4F1E8" fill-opacity="0.55"/>

  <!-- Three yellow-dash bullets -->
  <rect x="356" y="232" width="14" height="2" fill="#E8FF3C"/>
  <rect x="376" y="232" width="180" height="5" rx="0.5" fill="#F4F1E8" fill-opacity="0.8"/>

  <rect x="356" y="252" width="14" height="2" fill="#E8FF3C"/>
  <rect x="376" y="252" width="160" height="5" rx="0.5" fill="#F4F1E8" fill-opacity="0.8"/>

  <rect x="356" y="272" width="14" height="2" fill="#E8FF3C"/>
  <rect x="376" y="272" width="190" height="5" rx="0.5" fill="#F4F1E8" fill-opacity="0.8"/>
</svg>
