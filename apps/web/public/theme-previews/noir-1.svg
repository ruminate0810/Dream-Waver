<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Noir theme — title slide preview">
  <defs>
    <pattern id="grainN" x="0" y="0" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="#0A0A0B"/>
      <circle cx="20" cy="20" r="0.5" fill="#F4F1E8" opacity="0.04"/>
      <circle cx="80" cy="60" r="0.5" fill="#F4F1E8" opacity="0.05"/>
      <circle cx="120" cy="120" r="0.4" fill="#F4F1E8" opacity="0.04"/>
      <circle cx="40" cy="100" r="0.6" fill="#F4F1E8" opacity="0.03"/>
      <circle cx="100" cy="40" r="0.4" fill="#F4F1E8" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="640" height="360" fill="url(#grainN)"/>

  <!-- Contact-sheet header -->
  <line x1="40" y1="48" x2="600" y2="48" stroke="#F4F1E8" stroke-opacity="0.16" stroke-width="0.5"/>
  <text x="40" y="40" font-family="ui-monospace, Menlo, monospace" font-size="7" letter-spacing="3" fill="#9A9590">NOIR · NEGATIVE 35MM · DREAM·WAVER</text>

  <!-- Acid yellow sprocket + kicker -->
  <rect x="40" y="218" width="6" height="6" fill="#E8FF3C"/>
  <text x="52" y="223" font-family="ui-monospace, Menlo, monospace" font-size="8" letter-spacing="3" fill="#E8FF3C">VOL · I · 2026</text>

  <!-- Title — Bodoni thin -->
  <text x="40" y="280" font-family="'Bodoni Moda', Didot, Georgia, serif" font-size="56" font-weight="200" letter-spacing="1" fill="#F4F1E8">After Dark</text>

  <!-- Subtitle italic -->
  <text x="40" y="312" font-family="'Bodoni Moda', Georgia, serif" font-style="italic" font-size="14" fill="#9A9590">A photographic essay in fifteen frames</text>

  <!-- Bottom frame code -->
  <text x="528" y="338" font-family="ui-monospace, Menlo, monospace" font-size="7" letter-spacing="3" fill="#5A5650">— FRAME 001</text>
</svg>
