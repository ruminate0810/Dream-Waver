<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Before-after layout — two images side by side with labels">
  <defs>
    <linearGradient id="beforeImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6f5f"/>
      <stop offset="1" stop-color="#3b362d"/>
    </linearGradient>
    <linearGradient id="afterImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7e9eb8"/>
      <stop offset="1" stop-color="#2c4055"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#F2EEE7"/>

  <!-- title -->
  <text x="40" y="50" font-family="Georgia, 'Fraunces', serif" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#1A1614">阳台改造 · 蜕变前后</text>

  <!-- LEFT half: BEFORE -->
  <rect x="40" y="70" width="270" height="240" rx="6" fill="url(#beforeImg)"/>
  <!-- suggest clutter shapes -->
  <rect x="60" y="200" width="40" height="60" fill="#FFFFFF" fill-opacity="0.10"/>
  <rect x="115" y="180" width="60" height="80" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="220" cy="240" r="30" fill="#FFFFFF" fill-opacity="0.12"/>
  <!-- label pill -->
  <rect x="56" y="84" width="92" height="22" rx="11" fill="#0F172A" fill-opacity="0.62"/>
  <text x="63" y="99" font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="3" fill="#FFFFFF">BEFORE</text>

  <!-- RIGHT half: AFTER -->
  <rect x="330" y="70" width="270" height="240" rx="6" fill="url(#afterImg)"/>
  <!-- suggest clean lines -->
  <rect x="350" y="180" width="230" height="6" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="350" y="200" width="100" height="80" fill="#FFFFFF" fill-opacity="0.10"/>
  <rect x="470" y="220" width="110" height="50" fill="#FFFFFF" fill-opacity="0.10"/>
  <!-- label pill -->
  <rect x="346" y="84" width="80" height="22" rx="11" fill="#0F172A" fill-opacity="0.62"/>
  <text x="353" y="99" font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="3" fill="#FFFFFF">AFTER</text>

  <!-- caption -->
  <text x="40" y="338" font-family="Georgia, 'Fraunces', serif" font-style="italic" font-size="13" fill="#57534E">一周改造，预算 ¥2,800。</text>
</svg>
