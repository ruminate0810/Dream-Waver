<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Pull-quote layout — context paragraph plus giant quote plus attribution">
  <rect width="640" height="360" fill="#F2EEE7"/>

  <!-- context paragraph (small, italic, top) -->
  <g font-family="Georgia, 'Fraunces', serif" font-style="italic" fill="#57534E">
    <text x="80" y="58" font-size="14">在 AI agent 范式爆发之前，Liang 用一句话定调了 DeepSeek 的方向 —</text>
  </g>

  <!-- giant decorative quotation mark -->
  <text x="80" y="200" font-family="Georgia, serif" font-size="200" font-weight="700" fill="#B5371E" opacity="0.7">&#8220;</text>

  <!-- huge pull-quote -->
  <g font-family="Georgia, 'Fraunces', serif" fill="#1A1614">
    <text x="148" y="174" font-size="36" font-weight="500" letter-spacing="-0.015em">真正的开源</text>
    <text x="148" y="216" font-size="36" font-weight="500" letter-spacing="-0.015em">不是分享代码，</text>
    <text x="148" y="258" font-size="36" font-weight="500" letter-spacing="-0.015em">是分享智能。</text>
  </g>

  <!-- attribution + citation -->
  <g font-family="Georgia, 'Fraunces', serif">
    <text x="80" y="306" font-size="16" font-weight="600" fill="#B5371E">&#8212; Liang Wenfeng · DeepSeek 创始人</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" fill="#57534E">
    <text x="80" y="328" font-size="10" letter-spacing="2">DEEPSEEK BLOG · 2026-03 · &#167;4</text>
  </g>
</svg>
