<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Bento-grid layout — 1 large card and 3 small cards in an asymmetric mosaic">
  <defs>
    <linearGradient id="bentoImg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5C6B73"/>
      <stop offset="1" stop-color="#293439"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#F2EEE7"/>

  <!-- title -->
  <text x="40" y="50" font-family="Georgia, 'Fraunces', serif" font-size="20" font-weight="600" letter-spacing="-0.3" fill="#1A1614">产品全貌</text>

  <!-- LARGE card (top-left, spans 2x2 in concept; here 280×220) — TEXT type -->
  <rect x="40" y="70" width="280" height="220" rx="14" fill="#ffffff" stroke="#1A1614" stroke-opacity="0.08"/>
  <text x="62" y="120" font-family="Georgia, 'Fraunces', serif" font-size="28" font-weight="600" letter-spacing="-0.5" fill="#1A1614">设计是产品的灵魂</text>
  <rect x="62" y="160" width="226" height="6" rx="1" fill="#1A1614" fill-opacity="0.5"/>
  <rect x="62" y="174" width="200" height="6" rx="1" fill="#1A1614" fill-opacity="0.5"/>
  <rect x="62" y="188" width="180" height="6" rx="1" fill="#1A1614" fill-opacity="0.5"/>

  <!-- small card 1: METRIC -->
  <rect x="340" y="70" width="260" height="100" rx="14" fill="#ffffff" stroke="#1A1614" stroke-opacity="0.08"/>
  <text x="362" y="130" font-family="Georgia, 'Fraunces', serif" font-size="48" font-weight="700" letter-spacing="-0.03em" fill="#B5371E">99.9%</text>
  <text x="362" y="152" font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="3" fill="#57534E">UPTIME · LAST 90 DAYS</text>

  <!-- small card 2: IMAGE -->
  <rect x="340" y="190" width="125" height="100" rx="14" fill="url(#bentoImg)"/>
  <circle cx="403" cy="232" r="22" fill="#FFFFFF" fill-opacity="0.12"/>
  <rect x="350" y="270" width="68" height="14" rx="7" fill="#0F172A" fill-opacity="0.55"/>
  <text x="356" y="280" font-family="ui-monospace, Menlo, monospace" font-size="7" letter-spacing="2" fill="#FFFFFF">现场图</text>

  <!-- small card 3: TEXT -->
  <rect x="475" y="190" width="125" height="100" rx="14" fill="#ffffff" stroke="#1A1614" stroke-opacity="0.08"/>
  <text x="490" y="220" font-family="Georgia, 'Fraunces', serif" font-size="16" font-weight="600" fill="#1A1614">快速接入</text>
  <rect x="490" y="234" width="100" height="5" rx="1" fill="#1A1614" fill-opacity="0.5"/>
  <rect x="490" y="246" width="78" height="5" rx="1" fill="#1A1614" fill-opacity="0.5"/>
  <rect x="490" y="258" width="92" height="5" rx="1" fill="#1A1614" fill-opacity="0.5"/>
</svg>
