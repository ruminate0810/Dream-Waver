<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Split-image layout — image left, headline plus body plus bullets right">
  <defs>
    <linearGradient id="splitPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4F2E"/>
      <stop offset="0.55" stop-color="#5A3924"/>
      <stop offset="1" stop-color="#2A1C12"/>
    </linearGradient>
    <radialGradient id="splitRim" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- LEFT: image half -->
  <rect x="0" y="0" width="320" height="360" fill="url(#splitPhoto)"/>
  <rect x="0" y="0" width="320" height="360" fill="url(#splitRim)"/>
  <!-- suggest a bowl shape -->
  <ellipse cx="180" cy="220" rx="120" ry="38" fill="#FFFFFF" fill-opacity="0.12"/>
  <ellipse cx="180" cy="210" rx="110" ry="30" fill="#0F172A" fill-opacity="0.32"/>
  <ellipse cx="200" cy="195" rx="14" ry="8" fill="#FFFFFF" fill-opacity="0.18"/>
  <!-- mono credit pill -->
  <rect x="14" y="328" width="92" height="18" rx="9" fill="#0F172A" fill-opacity="0.55" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.7"/>
  <text x="22" y="341" font-family="ui-monospace, Menlo, monospace" font-size="7.5" letter-spacing="2" fill="#FFFFFF" fill-opacity="0.7">AI · GEMINI</text>

  <!-- RIGHT: text half (cream/editorial bg) -->
  <rect x="320" y="0" width="320" height="360" fill="#F2EEE7"/>

  <!-- kicker (vermillion mono caps) -->
  <text x="356" y="120" font-family="ui-monospace, Menlo, monospace" font-size="9" letter-spacing="3" fill="#B5371E">A SIMPLE BOWL</text>

  <!-- title -->
  <text x="356" y="158" font-family="Georgia, 'Fraunces', serif" font-size="32" font-weight="700" letter-spacing="-0.5" fill="#1A1614">一兰拉面</text>

  <!-- body paragraph (two lines, suggested) -->
  <rect x="356" y="180" width="240" height="6" rx="1" fill="#1A1614" fill-opacity="0.5"/>
  <rect x="356" y="194" width="200" height="6" rx="1" fill="#1A1614" fill-opacity="0.5"/>

  <!-- bullets — 3 small squares + lines -->
  <rect x="356" y="222" width="6" height="6" fill="#B5371E"/>
  <rect x="370" y="223" width="180" height="5" rx="1" fill="#1A1614" fill-opacity="0.7"/>
  <rect x="356" y="240" width="6" height="6" fill="#B5371E"/>
  <rect x="370" y="241" width="158" height="5" rx="1" fill="#1A1614" fill-opacity="0.7"/>
  <rect x="356" y="258" width="6" height="6" fill="#B5371E"/>
  <rect x="370" y="259" width="194" height="5" rx="1" fill="#1A1614" fill-opacity="0.7"/>
</svg>
